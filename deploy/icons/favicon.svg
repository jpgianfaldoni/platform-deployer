<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Gradiente principal para a nuvem -->
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
  </defs>

  <!-- Background circle com borda sutil -->
  <circle cx="16" cy="16" r="15" fill="url(#bgGradient)"/>
  <circle cx="16" cy="16" r="15" fill="none" stroke="url(#cloudGradient)" stroke-width="0.5" stroke-opacity="0.5"/>

  <!-- Cloud icon com seta de upload -->
  <g filter="url(#glow)">
    <!-- Corpo da nuvem estilizada -->
    <path
      d="M24.5 17.5c1.4 0 2.5 1.1 2.5 2.5s-1.1 2.5-2.5 2.5H9c-1.9 0-3.5-1.6-3.5-3.5 0-1.6 1.1-3 2.6-3.4.1-2.5 2.2-4.6 4.8-4.6 1.4 0 2.6.6 3.5 1.5.7-.9 1.8-1.5 3-1.5 2.2 0 4 1.8 4 4v.5c.2 0 .4-.1.6-.1.3 0 .5.1.5.1z"
      fill="url(#cloudGradient)"
      opacity="0.9"
    />

    <!-- Seta de upload -->
    <g transform="translate(16, 16.5)">
      <!-- Haste da seta -->
      <rect x="-1.25" y="-1" width="2.5" height="6" rx="0.5" fill="#ffffff"/>
      <!-- Ponta da seta -->
      <polygon points="0,-4.5 3.5,0 -3.5,0" fill="#ffffff"/>
    </g>
  </g>
</svg>
